name: yt-research

on:
  schedule:
    # Daily, shortly after the YouTube API quota reset (midnight US Pacific).
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "run | verify-seeds | analyze"
        default: "run"

permissions:
  contents: write

concurrency:
  group: yt-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from ytr-data branch
        run: |
          git fetch origin ytr-data:ytr-data || true
          mkdir -p yt_research/data yt_research/reports
          if git rev-parse --verify ytr-data >/dev/null 2>&1; then
            mkdir -p /tmp/ytr-data
            git archive ytr-data | tar -x -C /tmp/ytr-data
            if [ -f /tmp/ytr-data/data/ytr.sqlite.gz ]; then
              gunzip -c /tmp/ytr-data/data/ytr.sqlite.gz > yt_research/data/ytr.sqlite
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r yt_research/requirements.txt pytest

      - name: Tests
        working-directory: yt_research
        run: python -m pytest -q tests

      - name: Research cycle
        working-directory: yt_research
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ytr ${{ github.event.inputs.cmd || 'run' }}

      - name: Pack database
        id: pack
        if: always()
        run: |
          set -e
          # Never ship a missing/empty/corrupt DB: abort here so the previous snapshot stays untouched.
          python - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect("yt_research/data/ytr.sqlite")
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok", "integrity_check failed"
          n = c.execute("SELECT COUNT(*) FROM topics").fetchone()[0]
          assert n > 0, "empty database"
          PY
          python -c "import sqlite3,glob; [(c:=sqlite3.connect(p)).execute('PRAGMA wal_checkpoint(TRUNCATE)') and c.execute('VACUUM') for p in glob.glob('yt_research/data/*.sqlite')]"
          rm -rf /tmp/out && mkdir -p /tmp/out/data
          gzip -9 -c yt_research/data/ytr.sqlite > /tmp/out/data/ytr.sqlite.gz
          cp -r yt_research/reports /tmp/out/reports
          gzip -t /tmp/out/data/ytr.sqlite.gz
          SIZE=$(stat -c %s /tmp/out/data/ytr.sqlite.gz)
          echo "packed size: $SIZE bytes"
          # GitHub rejects files > 100MB; fail loudly well before that so the artifact backup still works.
          [ "$SIZE" -lt 90000000 ] || { echo "::error::snapshot too large for git ($SIZE bytes)"; exit 1; }

      - name: Backup as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytr-data
          path: /tmp/out
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist to ytr-data branch (latest snapshot only)
        if: always() && steps.pack.outcome == 'success'
        run: |
          set -e
          cd /tmp/out
          git init -q -b ytr-data
          git config user.name "ytr-bot"
          git config user.email "ytr-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "ytr data $(date -u +%FT%TZ)"
          git push -q --force origin HEAD:ytr-data
