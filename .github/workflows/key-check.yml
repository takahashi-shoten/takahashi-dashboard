name: key-check

# Diagnoses the ANTHROPIC_API_KEY secret WITHOUT printing it: only its shape and whether the API accepts it.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "keys (default) | gemini | imagecompare | ttscompare | ttsvariants | produce"
        default: "keys"
      genre:
        description: "produce: ytr genre id"
        default: "history"
      format:
        description: "produce: long or short"
        default: "short"
      lang:
        description: "produce: ja or en"
        default: "en"
      topic:
        description: "produce: optional topic or angle hint"
        default: ""

permissions:
  contents: read

jobs:
  check:
    if: github.event.inputs.task == 'keys' || github.event.inputs.task == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret shape and validity
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.error
          k = os.environ.get("K", "")
          print("secret_present:", bool(k))
          print("length:", len(k))
          print("has_whitespace_or_newline:", bool(re.search(r"\s", k)), "| stripped_length:", len(k.strip()))
          parts = k.strip().split("-")
          print("shape (first 3 segments only):", "-".join(p if i < 3 else "…" for i, p in enumerate(parts[:4])) if parts else "")
          print("segments:", len(parts), "| non_ascii:", any(ord(c) > 127 for c in k))
          def call(headers):
              req = urllib.request.Request("https://api.anthropic.com/v1/models?limit=1", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  return f"error:{type(e).__name__}"
          kk = k.strip()
          print("models_with_x-api-key:", call({"x-api-key": kk, "anthropic-version": "2023-06-01"}))
          print("models_with_bearer:", call({"Authorization": "Bearer " + kk, "anthropic-version": "2023-06-01"}))
          PY

      - name: Check Gemini key and list models
        env:
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.error
          k = os.environ.get("G", "").strip()
          print("gemini_secret_present:", bool(k), "| length:", len(k), "| starts_with:", k[:4], "| has_whitespace:", bool(re.search(r"\s", k)))
          req = urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers={"x-goog-api-key": k})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  print("models_list_status:", r.status)
          except urllib.error.HTTPError as e:
              print("models_list_status:", e.code, "| reason:", (e.read().decode()[:200]).replace(chr(10), " "))
              raise SystemExit(0)
          names = [(m["name"].split("/")[-1], m.get("supportedGenerationMethods", [])) for m in data.get("models", [])]
          print("model_count:", len(names))
          for n, meth in names:
              if re.search(r"veo|video|omni|lyria|imagen|live|music|animate|i2v", n):
                  print("model:", n, meth)
          PY

  gemini-live:
    if: github.event.inputs.task == 'gemini' || github.event.inputs.task == 'imagecompare' || github.event.inputs.task == 'ttscompare' || github.event.inputs.task == 'ttsvariants' || github.event.inputs.task == 'ttsen' || github.event.inputs.task == 'music' || github.event.inputs.task == 'videoprobe' || github.event.inputs.task == 'diag' || github.event.inputs.task == 'brand' || github.event.inputs.task == 'thumbstudy' || github.event.inputs.task == 'thumbgen'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Install ffmpeg
        if: github.event.inputs.task == 'music'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Japanese font
        if: github.event.inputs.task == 'brand' || github.event.inputs.task == 'thumbgen'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ipafont-gothic fonts-noto-cjk
      - name: Gemini live test (one image + one grounded review)
        working-directory: studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDIO_GEMINI_REVIEW_MODEL: gemini-3.8-flash
        run: python -m studio.${{ github.event.inputs.task == 'imagecompare' && 'image_compare' || github.event.inputs.task == 'ttscompare' && 'tts_compare' || github.event.inputs.task == 'ttsvariants' && 'tts_variants' || github.event.inputs.task == 'ttsen' && 'tts_en_probe' || github.event.inputs.task == 'music' && 'music_live_test' || github.event.inputs.task == 'videoprobe' && 'video_probe' || github.event.inputs.task == 'diag' && 'diag' || github.event.inputs.task == 'brand' && 'brand' || github.event.inputs.task == 'thumbstudy' && 'thumb_study' || github.event.inputs.task == 'thumbgen' && 'thumb_manga' || 'gemini_live_test' }}
      - name: Publish sample image to studio-samples branch (so it can be viewed)
        if: always()
        run: |
          cd studio/work/gemini_live && ls
          git init -q -b studio-samples && git config user.name ytr-bot && git config user.email ytr-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A && git commit -qm "gemini live sample $(date -u +%FT%TZ)" && git push -q --force origin HEAD:studio-samples
      - name: Upload sample image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live
          path: studio/work/gemini_live
          if-no-files-found: ignore
          retention-days: 14

  produce:
    if: github.event.inputs.task == 'produce'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore research database
        run: |
          git fetch origin ytr-data:ytr-data
          mkdir -p /tmp/ytr && git archive ytr-data | tar -x -C /tmp/ytr
          gunzip -c /tmp/ytr/data/ytr.sqlite.gz > /tmp/ytr.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and a Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-ipafont-gothic
      - run: pip install requests pillow anthropic
      - name: Produce one video (real providers)
        working-directory: studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          P_GENRE: ${{ github.event.inputs.genre }}
          P_FORMAT: ${{ github.event.inputs.format }}
          P_LANG: ${{ github.event.inputs.lang }}
          P_TOPIC: ${{ github.event.inputs.topic }}
        run: python -m studio.produce --ytr-db /tmp/ytr.sqlite --genre "$P_GENRE" --lang "$P_LANG" --voice Iapetus --format "$P_FORMAT" --topic "$P_TOPIC"
      - name: Publish review files to studio-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          W=$(ls -d studio/work/*/ 2>/dev/null | head -1); echo "work dir: $W"; ls -la "$W" || true
          for f in short.mp4 preview.mp4 shorts.mp4 thumbnail.png final.srt script.json storyboard.json qa.json report.json; do
            [ -f "$W$f" ] && [ "$(stat -c %s "$W$f")" -lt 90000000 ] && cp "$W$f" /tmp/out/ || echo "skip $f"
          done
          cp -r "$W"visuals /tmp/out/visuals_sample 2>/dev/null && find /tmp/out/visuals_sample -name '*.png' | sort | sed -n '4,$p' | xargs -r rm -f || true
          cd /tmp/out && ls -la
          git init -q -b studio-output && git config user.name ytr-bot && git config user.email ytr-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A && git commit -qm "studio output $(date -u +%FT%TZ)" && git push -q --force origin HEAD:studio-output
