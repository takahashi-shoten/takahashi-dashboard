name: key-check

# Diagnoses the ANTHROPIC_API_KEY secret WITHOUT printing it: only its shape and whether the API accepts it.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "keys (default) | prompteval | gemini | imagecompare | ttscompare | ttsvariants | produce"
        default: "keys"
      genre:
        description: "produce: ytr genre id"
        default: "history"
      style:
        description: visual style (photo or manga)
        required: false
        default: photo
      seconds:
        description: "produce: target video length in seconds (default: 480 long / 50 short)"
        required: false
        default: ""
      script_only:
        description: "produce: set to 1 to stop after the script and QA (no voice/image spend)"
        required: false
        default: ""
      format:
        description: "produce: long or short"
        default: "short"
      lang:
        description: "produce: ja or en"
        default: "en"
      topic:
        description: "produce: optional topic or angle hint"
        default: ""

permissions:
  contents: read

jobs:
  check:
    if: github.event.inputs.task == 'keys' || github.event.inputs.task == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret shape and validity
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.error
          k = os.environ.get("K", "")
          print("secret_present:", bool(k))
          print("length:", len(k))
          print("has_whitespace_or_newline:", bool(re.search(r"\s", k)), "| stripped_length:", len(k.strip()))
          parts = k.strip().split("-")
          print("shape (first 3 segments only):", "-".join(p if i < 3 else "…" for i, p in enumerate(parts[:4])) if parts else "")
          print("segments:", len(parts), "| non_ascii:", any(ord(c) > 127 for c in k))
          def call(headers):
              req = urllib.request.Request("https://api.anthropic.com/v1/models?limit=1", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  return f"error:{type(e).__name__}"
          kk = k.strip()
          print("models_with_x-api-key:", call({"x-api-key": kk, "anthropic-version": "2023-06-01"}))
          print("models_with_bearer:", call({"Authorization": "Bearer " + kk, "anthropic-version": "2023-06-01"}))
          PY

      - name: Check Gemini key and list models
        env:
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.error
          k = os.environ.get("G", "").strip()
          print("gemini_secret_present:", bool(k), "| length:", len(k), "| starts_with:", k[:4], "| has_whitespace:", bool(re.search(r"\s", k)))
          req = urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers={"x-goog-api-key": k})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  print("models_list_status:", r.status)
          except urllib.error.HTTPError as e:
              print("models_list_status:", e.code, "| reason:", (e.read().decode()[:200]).replace(chr(10), " "))
              raise SystemExit(0)
          names = [(m["name"].split("/")[-1], m.get("supportedGenerationMethods", [])) for m in data.get("models", [])]
          print("model_count:", len(names))
          for n, meth in names:
              if re.search(r"veo|video|omni|lyria|imagen|live|music|animate|i2v", n):
                  print("model:", n, meth)
          PY

  gemini-live:
    if: github.event.inputs.task == 'gemini' || github.event.inputs.task == 'imagecompare' || github.event.inputs.task == 'ttscompare' || github.event.inputs.task == 'ttsvariants' || github.event.inputs.task == 'ttsen' || github.event.inputs.task == 'music' || github.event.inputs.task == 'videoprobe' || github.event.inputs.task == 'diag' || github.event.inputs.task == 'brand' || github.event.inputs.task == 'thumbstudy' || github.event.inputs.task == 'thumbgen' || github.event.inputs.task == 'thumbhist' || github.event.inputs.task == 'vuprobe' || github.event.inputs.task == 'vuanalyze' || github.event.inputs.task == 'vugt' || github.event.inputs.task == 'vudiag' || github.event.inputs.task == 'vustab' || github.event.inputs.task == 'vumk' || github.event.inputs.task == 'vubatch' || github.event.inputs.task == 'vustats' || github.event.inputs.task == 'vushorts' || github.event.inputs.task == 'kitsuke' || github.event.inputs.task == 'kitsukemotion'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Install ffmpeg
        if: github.event.inputs.task == 'music'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Japanese font
        if: github.event.inputs.task == 'brand' || github.event.inputs.task == 'thumbgen' || github.event.inputs.task == 'thumbhist'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ipafont-gothic fonts-noto-cjk
      - name: Fetch own video for ground-truth test (E1 preview + subtitles)
        if: github.event.inputs.task == 'vugt' || github.event.inputs.task == 'vudiag' || github.event.inputs.task == 'vustab'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          git fetch -q origin exp-E-20261124-01
          mkdir -p studio/work/vugt
          git show FETCH_HEAD:preview.mp4 > studio/work/vugt/preview.mp4
          git show FETCH_HEAD:final.srt > studio/work/vugt/final.srt
      - name: Gemini live test (one image + one grounded review)
        working-directory: studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STUDIO_GEMINI_REVIEW_MODEL: gemini-3.8-flash
        run: python -m studio.${{ github.event.inputs.task == 'imagecompare' && 'image_compare' || github.event.inputs.task == 'ttscompare' && 'tts_compare' || github.event.inputs.task == 'ttsvariants' && 'tts_variants' || github.event.inputs.task == 'ttsen' && 'tts_en_probe' || github.event.inputs.task == 'music' && 'music_live_test' || github.event.inputs.task == 'videoprobe' && 'video_probe' || github.event.inputs.task == 'diag' && 'diag' || github.event.inputs.task == 'brand' && 'brand' || github.event.inputs.task == 'thumbstudy' && 'thumb_study' || github.event.inputs.task == 'thumbgen' && 'thumb_manga' || github.event.inputs.task == 'thumbhist' && 'thumb_history' || github.event.inputs.task == 'vuprobe' && 'vu_probe' || github.event.inputs.task == 'vuanalyze' && 'video_analysis' || github.event.inputs.task == 'vugt' && 'vu_groundtruth' || github.event.inputs.task == 'vudiag' && 'vu_diag' || github.event.inputs.task == 'vustab' && 'vu_stab' || github.event.inputs.task == 'vumk' && 'vu_marketing' || github.event.inputs.task == 'vubatch' && 'vu_batch' || github.event.inputs.task == 'vustats' && 'vu_channel_stats' || github.event.inputs.task == 'vushorts' && 'vu_shorts' || github.event.inputs.task == 'kitsuke' && 'kitsuke_scene' || github.event.inputs.task == 'kitsukemotion' && 'kitsuke_motion' || 'gemini_live_test' }} ${{ github.event.inputs.task == 'vuanalyze' && format('{0} {1}', github.event.inputs.topic, github.event.inputs.genre) || github.event.inputs.task == 'vumk' && format('{0} {1}', github.event.inputs.topic, github.event.inputs.genre) || github.event.inputs.task == 'vushorts' && github.event.inputs.topic || github.event.inputs.task == 'vustats' && 'DYUxKuX0Bxc r-G2ryyJIbc,JjKQjOGB6aw,fxpKk4mvlqo,4cx8Ohmz2vs,DYUxKuX0Bxc,YzH5blXRHf8' || github.event.inputs.task == 'vubatch' && format('DYUxKuX0Bxc gemini-3.8-flash "{0}"', github.event.inputs.topic) || github.event.inputs.task == 'vugt' && 'work/vugt/preview.mp4 work/vugt/final.srt' || github.event.inputs.task == 'kitsukemotion' && '2 3 4' || github.event.inputs.task == 'vudiag' && format('work/vugt/preview.mp4 work/vugt/final.srt {0}', github.event.inputs.genre) || github.event.inputs.task == 'vustab' && 'work/vugt/preview.mp4 work/vugt/final.srt 120,600 3' || '' }}
      - name: Publish sample image to studio-samples branch (so it can be viewed)
        if: always()
        run: |
          cd studio/work/gemini_live && ls
          git init -q -b studio-samples && git config user.name ytr-bot && git config user.email ytr-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A && git commit -qm "gemini live sample $(date -u +%FT%TZ)" && git push -q --force origin HEAD:studio-samples
      - name: Upload sample image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live
          path: studio/work/gemini_live
          if-no-files-found: ignore
          retention-days: 14

  produce:
    if: github.event.inputs.task == 'produce' || github.event.inputs.task == 'qarerun'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore research database
        run: |
          git fetch origin ytr-data:ytr-data
          mkdir -p /tmp/ytr && git archive ytr-data | tar -x -C /tmp/ytr
          gunzip -c /tmp/ytr/data/ytr.sqlite.gz > /tmp/ytr.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and a Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-ipafont-gothic
      - run: pip install requests pillow anthropic
      - name: Produce one video (real providers)
        if: github.event.inputs.task == 'produce'
        working-directory: studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          P_GENRE: ${{ github.event.inputs.genre }}
          P_FORMAT: ${{ github.event.inputs.format }}
          P_STYLE: ${{ github.event.inputs.style }}
          P_SECONDS: ${{ github.event.inputs.seconds }}
          P_SCRIPT_ONLY: ${{ github.event.inputs.script_only }}
          P_LANG: ${{ github.event.inputs.lang }}
          P_TOPIC: ${{ github.event.inputs.topic }}
        run: python -m studio.produce --ytr-db /tmp/ytr.sqlite --genre "$P_GENRE" --lang "$P_LANG" --voice Iapetus --format "$P_FORMAT" --style "${P_STYLE:-photo}" ${P_SECONDS:+--target-seconds "$P_SECONDS"} ${P_SCRIPT_ONLY:+--script-only} --topic "$P_TOPIC"
      - name: Re-run QA on an existing script (no generation)
        if: github.event.inputs.task == 'qarerun'
        working-directory: studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          P_BRANCH: ${{ github.event.inputs.topic }}
        run: |
          git fetch --depth=1 origin "$P_BRANCH"
          git show FETCH_HEAD:script.json > /tmp/rerun_script.json
          python -m studio.qa_rerun /tmp/rerun_script.json ja
      - name: Publish review files to studio-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          W=$(ls -d studio/work/*/ 2>/dev/null | head -1); echo "work dir: $W"; ls -la "$W" || true
          for f in short.mp4 preview.mp4 shorts.mp4 thumbnail.png final.srt script.json storyboard.json qa.json report.json; do
            [ -f "$W$f" ] && [ "$(stat -c %s "$W$f")" -lt 90000000 ] && cp "$W$f" /tmp/out/ || echo "skip $f"
          done
          cp -r "$W"visuals /tmp/out/visuals_sample 2>/dev/null && find /tmp/out/visuals_sample -name '*.png' | sort | sed -n '4,$p' | xargs -r rm -f || true
          cd /tmp/out && ls -la
          git init -q -b studio-output && git config user.name ytr-bot && git config user.email ytr-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A && git commit -qm "studio output $(date -u +%FT%TZ)" && git push -q --force origin HEAD:studio-output

  prompteval:
    if: github.event.inputs.task == 'prompteval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run A/B prompt evaluation (products/eval/PREREGISTRATION.md)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python products/eval/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: products/eval/out/results.json
