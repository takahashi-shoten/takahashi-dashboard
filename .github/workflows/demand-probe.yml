name: demand-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 commerce_research/demand_probe.py docs/projects/global_demand/data/probe_${{ github.run_id }}
      - name: Commit results
        run: |
          git config user.name "demand-probe"; git config user.email "actions@users.noreply.github.com"
          git add docs/projects/global_demand/data
          git commit -m "demand-probe: raw public observations (run ${{ github.run_id }})" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
